<!--#compare-grid-->
<section class="panel">
  <div class="panel-head"><i></i>{{HEAD}}</div>
  <div class="panel-sub">{{SUB}}</div>
  <div class="grades">{{ITEMS}}</div>
</section>

<!--#split-figure-->
<section class="panel">
  <div class="split">
    <div class="col-text">
      <div class="panel-head"><i></i>{{HEAD}}</div>
      <div class="statement" style="margin-top:14px"><p>{{BODY}}</p></div>
      {{NOTE}}
    </div>
    <div class="col-fig">
      <div class="figwrap">{{FIGURE}}<div class="figcap">{{FIGCAP}}</div></div>
    </div>
  </div>
</section>

<!--#quad-cards-->
<div class="quad">{{ITEMS}}</div>

<!--#numbered-cols-->
<div class="numcols">{{ITEMS}}</div>

<!--#statement-band-->
<section class="panel" style="justify-content:center;flex:0 0 auto;min-height:200px">
  <div class="statement">{{TEXT}}</div>
  {{EXTRA}}
</section>

<!--#warning-bar-->
<div class="warn"><div class="wi">!</div><div class="wt">{{TEXT}}</div></div>

<!--#checklist-->
<div class="checklist"><div class="ct">{{TITLE}}</div><ul>{{ITEMS}}</ul></div>

<!--#summary-grid-->
<div class="summary">{{ITEMS}}</div>

<!--#entry-row-->
<div class="entries">{{ITEMS}}</div>
